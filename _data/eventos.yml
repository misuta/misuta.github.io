# _data/eventos.yml — Calendario cripto y macro (Mizuta's Blog)
# v3 · 23 nov 2026 · Aprobado
# Cambios respecto a v2:
#   - DAC8: el 1 ene 2027 no empiezan los reportes; se sustituye por el primer intercambio entre países (30 sep 2027)
#   - GENIUS: fecha fija (18 ene 2027) al no haber reglas finales → confirmado; contexto ajustado (prohibición para plataformas en jul 2028)
#   - BNB Jenner: confirmado (8 dic 2026, 02:30 UTC)
#   - ARB: fechas corregidas (15 dic 2026 y 14 ene 2027); el bloqueo de equipo e inversores termina entre feb y mar 2027
#   - Gobierno de EE.UU.: financiación hasta el 11 dic 2026 confirmada por ley
#   - Banco de Japón: 17-18 dic 2026 confirmado
#   - Deribit: fuente oficial (último viernes del trimestre, 08:00 UTC)
#   - Actas FOMC dic: provisional (la Fed aún no publica la fecha; regla de 3 semanas)
#   - ONDO: provisional, las fuentes difieren entre el 17 y el 18 ene 2027
#   - Fuentes del agregador industrylink.online sustituidas por fuentes primarias o de datos
#   - Verificadas contra fuentes oficiales: todas las fechas de CPI, NFP y PPI (BLS), PCE (BEA), FOMC 2027 (Fed) y BCE
#
# Campos:
#   id           identificador único (aaaa-mm-dd-slug)
#   titulo       nombre corto del evento
#   fecha        ISO 8601 en UTC. Sin hora => "todo_el_dia: true"
#   todo_el_dia  true si no hay hora fija
#   categoria    macro | cripto | regulacion
#   importancia  alta | media
#   activos      monedas o mercados más afectados
#   estado       confirmado (fuente oficial) | provisional (fecha sujeta a cambios)
#   contexto     una línea: por qué importa (si falta, la página usa la plantilla de su tipo)
#   fuente       URL de referencia
#
# Notas de horario:
#   - EE.UU. en horario de verano del 14 mar al 7 nov 2027 → CPI/NFP/PPI/PCE a las 12:30 UTC, FOMC a las 18:00 UTC
#   - UE en horario de verano del 28 mar al 31 oct 2027 → BCE a las 12:15 UTC
#   - Fuera de esas fechas: CPI/NFP/PPI/PCE 13:30 UTC, FOMC 19:00 UTC, BCE 13:15 UTC

# ───────────────────────── PLANTILLAS DE CONTEXTO (para reutilizar) ─────────────────────────
# FOMC: "La Fed decide los tipos de interés en EE.UU.; tipos más bajos suelen favorecer a BTC y a los activos de riesgo."
# CPI:  "Dato de inflación de EE.UU.; si sale por encima de lo esperado aleja las bajadas de tipos y suele presionar a la baja a cripto."
# NFP:  "Informe de empleo de EE.UU.; un mercado laboral débil aumenta las probabilidades de bajadas de tipos."
# PPI:  "Precios que pagan los productores; suele adelantar la tendencia del CPI."
# PCE:  "Indicador de inflación preferido de la Fed; rara vez sorprende porque se estima a partir del CPI y el PPI."
# BCE:  "El BCE decide los tipos en la eurozona; afecta al euro y al apetito por riesgo en Europa."

