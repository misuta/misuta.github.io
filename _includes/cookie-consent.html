{%- if jekyll.environment == 'production' and site.ga_measurement_id -%}
<!-- Banner de consentimiento: Google Analytics NO se carga hasta que el visitante acepta -->
<div id="cookie-banner" class="cookie-banner" role="dialog" aria-live="polite" aria-label="Consentimiento de cookies" hidden>
  <p class="cookie-text">
    Usamos cookies de Google Analytics para saber qué artículos se leen.
    No se carga nada hasta que aceptes, y puedes cambiar de opinión cuando quieras.
    <a href="{{ '/politica-de-cookies/' | relative_url }}">Más información</a>
  </p>
  <div class="cookie-actions">
    <button type="button" class="cookie-btn" data-consent="rejected">Rechazar</button>
    <button type="button" class="cookie-btn" data-consent="accepted">Aceptar</button>
  </div>
</div>

<script>
  (function () {
    var GA_ID = '{{ site.ga_measurement_id }}';
    var KEY = 'cookie_consent';
    var banner = document.getElementById('cookie-banner');

    function read() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
    function save(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }

    function loadAnalytics() {
      if (window.__gaLoaded) return;
      window.__gaLoaded = true;
      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { dataLayer.push(arguments); };
      gtag('js', new Date());
      gtag('config', GA_ID, { cookie_domain: location.hostname });
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
      document.head.appendChild(s);
    }

    function clearAnalyticsCookies() {
      document.cookie.split(';').forEach(function (c) {
        var name = c.split('=')[0].trim();
        if (name.indexOf('_ga') !== 0) return;
        ['', location.hostname, '.' + location.hostname].forEach(function (d) {
          document.cookie = name + '=; Max-Age=0; path=/' + (d ? '; domain=' + d : '');
        });
      });
    }

    function decide(value) {
      var previous = read();
      save(value);
      banner.hidden = true;
      if (value === 'accepted') {
        loadAnalytics();
      } else if (previous === 'accepted') {
        // Consentimiento retirado: borrar cookies de GA y recargar para que el script desaparezca
        clearAnalyticsCookies();
        location.reload();
      }
    }

    // Se reabre desde el enlace "Configurar cookies" del footer
    window.cookieSettings = function () { banner.hidden = false; };

    banner.addEventListener('click', function (e) {
      var value = e.target.getAttribute && e.target.getAttribute('data-consent');
      if (value) decide(value);
    });

    var current = read();
    if (current === 'accepted') loadAnalytics();
    else if (!current) banner.hidden = false;
  })();
</script>
{%- endif -%}
